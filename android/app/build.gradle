plugins {
    id 'com.android.application'
}

def vCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
def vName = project.hasProperty('versionName') ? project.property('versionName') : "1.0.0"

android {
    namespace 'com.platypus.revver'
    compileSdk 34

    defaultConfig {
        applicationId "com.platypus.revver"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: (project.hasProperty('releaseKeystorePath') ? project.property('releaseKeystorePath') : "")
            def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: (project.hasProperty('releaseKeystorePassword') ? project.property('releaseKeystorePassword') : "")
            def ksAlias = System.getenv("ANDROID_KEYSTORE_ALIAS") ?: (project.hasProperty('releaseKeystoreAlias') ? project.property('releaseKeystoreAlias') : "")

            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: (project.hasProperty('releaseKeystorePath') ? project.property('releaseKeystorePath') : "")
            if (ksPath && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Sync web application assets into Android assets
tasks.register('syncWebAssets', Copy) {
    from("${rootDir}/..") {
        include 'index.html', 'style.css', 'app.js', 'audio_engine.js', 'drivetrain.js', 'engine_sim_processor.js', 'sensors.js', 'sounds/**'
    }
    into("${projectDir}/src/main/assets")
}

project.afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn tasks.named('syncWebAssets')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
}
